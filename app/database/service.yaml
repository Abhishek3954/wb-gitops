apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: myapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: myapp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
