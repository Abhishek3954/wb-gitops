apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: myapp

resources:
- ../../app/
- clustersecretstore.yaml
- externalsecret.yaml
- ingress.yaml
- web-networkpolicy.yaml
- storageclass.yaml

images:
- name: backend
  newName: 793168138853.dkr.ecr.ap-south-1.amazonaws.com/whiteboard/server
  newTag: 0cfa77c
- name: mongo
  newName: 793168138853.dkr.ecr.ap-south-1.amazonaws.com/whiteboard/mongo
  newTag: 8.3.4-noble
- name: web
  newName: 793168138853.dkr.ecr.ap-south-1.amazonaws.com/whiteboard/app
  newTag: 709d608

patches:
- patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: gp3
  target:
    kind: StatefulSet
    name: db
