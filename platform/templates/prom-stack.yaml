apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 92.13.0
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          enabled: true
        prometheus:
          prometheusSpec:
            scrapeInterval: 30s
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: prometheus-stack-grafana
      jsonPointers:
        - /data/admin-password
        - data/admin-user
